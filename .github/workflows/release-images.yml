name: Release images

# Builds the backend service images and publishes them to GitHub Container
# Registry, so the production server only pulls and runs them. The Coolify box
# has 1 CPU and under 2 GB of RAM: a typecheck plus a bundle on it runs out of
# memory, and a build there would compete with the apps already serving.
#
# Triggered by a push to main (a merged release) or by hand. Nothing here reads
# event payload text into a run step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: worker
            dockerfile: apps/worker/Dockerfile
          - app: mcp
            dockerfile: apps/mcp/Dockerfile
          - app: links
            dockerfile: apps/links/Dockerfile
          - app: migrate
            dockerfile: packages/database/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; the owner is not.
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          APP: ${{ matrix.app }}
        run: echo "image=ghcr.io/${OWNER,,}/postarray-${APP}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:main
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
