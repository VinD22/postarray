packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - 'prisma'
  - 'esbuild'
  - 'sharp'

# Security patches for transitive dependencies pinned by upstream packages.
# Prisma 6 uses deepmerge's public merge API, retained in v8. Generation and
# the repository suite validate that boundary until Prisma updates its pin.
overrides:
  'nanoid@<3.3.18': '3.3.18'
  'fast-uri@>=3.0.0 <3.1.6': '3.1.6'
  'fast-uri@>=4.0.0 <4.1.3': '4.1.3'
  'multer@>=2.0.0 <2.3.0': '2.4.0'
  'deepmerge-ts@>=7.0.0 <8.0.0': '8.0.0'
  'hono@>=4.0.0 <4.13.5': '4.13.5'
  'qs@>=6.0.0 <6.16.0': '6.16.0'
