      - generic [ref=f4e254]:
        - heading "Ce pour quoi Relay est conçu pour être bon" [level=2] [ref=f4e255]
        - generic [ref=f4e256]:
          - generic [ref=f4e257]:
            - generic [ref=f4e258]: "01"
            - generic [ref=f4e259]:
              - heading "Publiez en toute confiance" [level=3] [ref=f4e260]
              - paragraph [ref=f4e261]: Un véritable aperçu par compte, des vérifications déterministes de la politique et de la plate-forme avant que quoi que ce soit ne soit mis en file d'attente, l'approbation requise par votre espace de travail, un reçu immuable avec l'ID de publication externe et un état de santé pour chaque connexion.
              - paragraph [ref=f4e262]: Chaque écriture externe comporte une clé d'idempotence, donc un crash de travailleur après que la plateforme a accepté une publication n'en crée pas une seconde.
          - generic [ref=f4e263]:
            - generic [ref=f4e264]: "02"
            - generic [ref=f4e265]:
              - heading "S'adapter plutôt que dupliquer" [level=3] [ref=f4e266]
              - paragraph [ref=f4e267]: Variantes par plate-forme que vous pouvez remplacer un compte à la fois, et transcréation plutôt que traduction littérale, avec un glossaire de marque et un réviseur nommé par langue.
              - paragraph [ref=f4e268]: L'interface est disponible dans certaines langues. L'adaptation du contenu couvre 30 langues de contenu et chacune d'entre elles peut être révisée avant sa publication.
          - generic [ref=f4e269]:
            - generic [ref=f4e270]: "03"
            - generic [ref=f4e271]:
              - heading "Fermer la boucle" [level=3] [ref=f4e272]
              - paragraph [ref=f4e273]: Des analyses qui nomment la métrique, la plate-forme qui l'a signalée, le dénominateur et la date de sa dernière actualisation. Lorsqu'une plateforme ne signale pas quelque chose, Relay l'indique au lieu d'afficher un zéro.
              - paragraph [ref=f4e274]: Une publication est comparée à votre propre médiane plutôt qu’à un score que personne ne peut auditer.
          - generic [ref=f4e275]:
            - generic [ref=f4e276]: "04"
            - generic [ref=f4e277]:
              - heading "Travaillez là où vous êtes déjà" [level=3] [ref=f4e278]
              - paragraph [ref=f4e279]: L'application web, une API REST, un serveur MCP distant, une CLI et des webhooks signés appellent les mêmes services applicatifs, les mêmes règles d'autorisation et les mêmes validateurs.
              - paragraph [ref=f4e280]: Un agent ne peut pas contourner une stratégie d'approbation en utilisant une surface différente, car la stratégie est appliquée dans le service et non dans l'interface.
          - generic [ref=f4e281]:
            - generic [ref=f4e282]: "05"
            - generic [ref=f4e283]:
              - heading "Economics you can predict" [level=3] [ref=f4e284]
              - paragraph [ref=f4e285]: One price, every shipped feature, 10 active channels and an owner plus 5 teammates. Platform usage that a provider charges per operation is passed through at cost and shown before you confirm the action.
              - paragraph [ref=f4e286]: There is no image or video generation credit system, because Relay does not generate media.
      - generic [ref=f4e289]:
        - heading "Cinq surfaces, un backend" [level=2] [ref=f4e290]
        - paragraph [ref=f4e291]: Les mêmes cas d'utilisation, les mêmes contrôles de location, les mêmes validateurs et les mêmes workflows de publication. Une surface est une porte d’entrée, jamais un raccourci au-delà d’une règle.
        - generic [ref=f4e292]:
          - generic [ref=f4e293]: "5"
          - paragraph [ref=f4e294]: Surfaces on one shared backend
        - generic [ref=f4e295]:
          - generic [ref=f4e297]:
            - heading "Application Web" [level=3] [ref=f4e298]
            - paragraph [ref=f4e299]: Composer, calendrier, approbations, analyses, connexions et paramètres.
          - generic [ref=f4e301]:
            - heading "API REST" [level=3] [ref=f4e302]
            - paragraph [ref=f4e303]: Clés étendues, clés d'idempotence à chaque écriture, pagination du curseur, erreurs de frappe.
          - generic [ref=f4e305]:
            - heading "Serveur MCP distant" [level=3] [ref=f4e306]
            - paragraph [ref=f4e307]: HTTP diffusable, OAuth, portées par outil et un aperçu avant chaque appel consécutif.
          - generic [ref=f4e309]:
            - heading "CLI" [level=3] [ref=f4e310]
            - paragraph [ref=f4e311]: Sortie stable lisible par machine pour les scripts et l’intégration continue.
          - generic [ref=f4e313]:
            - heading "Webhooks signés" [level=3] [ref=f4e314]
            - paragraph [ref=f4e315]: Publiez les résultats, les décisions d’approbation et l’état de la connexion, avec relivraison.
        - paragraph [ref=f4e316]:
          - link "Pour les développeurs" [ref=f4e317] [cursor=pointer]:
            - /url: /fr/for-developers
      - generic [ref=f4e321]:
        - heading "Ce que Relay ne fait pas" [level=2] [ref=f4e322]
        - paragraph [ref=f4e323]: Ce sont des limites, pas une feuille de route. Si l'un d'entre eux change, il change d'abord dans le journal des modifications.
        - list [ref=f4e324]:
          - listitem [ref=f4e325]:
            - paragraph [ref=f4e329]: No AI image generation and no AI video generation. Relay adapts, approves, publishes and measures the media you bring.
          - listitem [ref=f4e330]:
            - paragraph [ref=f4e334]: Pas de likes, de suivis, de republications, de réponses non sollicitées ou de messages directs automatiques. Pas de modules d'engagement et pas d'engagement fabriqué.
          - listitem [ref=f4e335]:
            - paragraph [ref=f4e339]: Pas d'automatisation du navigateur, pas de relecture de cookies, pas de scraping et pas de points de terminaison de publication non officiels. API de plateforme officielle uniquement.
          - listitem [ref=f4e340]:
            - paragraph [ref=f4e344]: Aucune promesse concernant la portée, le classement ou l'engagement. Relay peut vous dire ce qui s'est passé et ce qu'il faut tester ensuite. Il ne peut pas vous dire ce que fera un public.
          - listitem [ref=f4e345]:
            - paragraph [ref=f4e349]: Pas de publication sans surveillance par défaut. Un agent peut rédiger, valider et demander une approbation. Un être humain décide avant que quoi que ce soit ne devienne public, à moins que vous ne retiriez délibérément une politique spécifique.
        - paragraph [ref=f4e350]:
          - link "Journal des modifications" [ref=f4e351] [cursor=pointer]:
            - /url: /fr/changelog
