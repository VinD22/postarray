        - generic [ref=f15e184]:
          - heading "Publishing right now needs a person" [level=3] [ref=f15e185]
          - paragraph [ref=f15e186]: Asking an agent to publish immediately does not publish. Relay mints a pending confirmation bound to the workspace, the grant, the post and a fingerprint of the exact accounts, and hands back a link on the Relay domain. You open it in your own session, see what will go out and where, and approve. Change the post afterwards and the fingerprint changes with it, which voids the approval.
