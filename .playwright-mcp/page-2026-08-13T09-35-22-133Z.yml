      - generic [ref=f15e567]:
        - heading "What Relay is built to be good at" [level=2] [ref=f15e568]
        - paragraph [ref=f15e569]: Turn one sourced idea into platform-native content, approve it once, publish it reliably, and learn what to improve next.
        - generic [ref=f15e570]:
          - generic [ref=f15e571]:
            - heading "Publish with confidence" [level=3] [ref=f15e574]
            - generic [ref=f15e575]:
              - paragraph [ref=f15e576]: A true preview per account, deterministic policy and platform checks before anything is queued, the approval your workspace requires, an immutable receipt with the external post ID, and a health state for every connection.
              - paragraph [ref=f15e577]: Every external write carries an idempotency key, so a worker crash after the platform accepted a post does not create a second one.
          - generic [ref=f15e578]:
            - heading "Adapt rather than duplicate" [level=3] [ref=f15e581]
            - generic [ref=f15e582]:
              - paragraph [ref=f15e583]: Per platform variants that you can override one account at a time, and transcreation rather than literal translation, with a brand glossary and a named reviewer per language.
              - paragraph [ref=f15e584]: The interface is available in selected languages. Content adaptation covers 30 content languages and every one of them is reviewable before it publishes.
          - generic [ref=f15e585]:
            - heading "Close the loop" [level=3] [ref=f15e588]
            - generic [ref=f15e589]:
              - paragraph [ref=f15e590]: Analytics that name the metric, the platform that reported it, the denominator and when it was last refreshed. Where a platform does not report something, Relay says so instead of showing a zero.
              - paragraph [ref=f15e591]: A post is compared against your own median rather than against a score nobody can audit.
          - generic [ref=f15e592]:
            - heading "Work from where you already are" [level=3] [ref=f15e595]
            - generic [ref=f15e596]:
              - paragraph [ref=f15e597]: The web app, a REST API, a remote MCP server, a CLI and signed webhooks call the same application services, the same authorization rules and the same validators.
              - paragraph [ref=f15e598]: An agent cannot bypass an approval policy by using a different surface, because the policy is enforced in the service, not in the interface.
          - generic [ref=f15e599]:
            - heading "Economics you can predict" [level=3] [ref=f15e602]
            - generic [ref=f15e603]:
              - paragraph [ref=f15e604]: One price, every shipped feature, 10 active channels and an owner plus 5 teammates. Platform usage that a provider charges per operation is passed through at cost and shown before you confirm the action.
              - paragraph [ref=f15e605]: There is no image or video generation credit system, because Relay does not generate media.
      - generic [ref=f15e609]:
        - heading "What Relay does not do" [level=2] [ref=f15e610]
        - paragraph [ref=f15e611]: These are boundaries, not a roadmap tease. If one of them changes, it changes on the changelog first.
        - list [ref=f15e612]:
          - listitem [ref=f15e613]:
            - paragraph [ref=f15e617]: No AI image generation and no AI video generation. Relay adapts, approves, publishes and measures the media you bring.
          - listitem [ref=f15e618]:
            - paragraph [ref=f15e622]: No automatic likes, follows, reposts, unsolicited replies or direct messages. No engagement pods and no fabricated engagement.
          - listitem [ref=f15e623]:
            - paragraph [ref=f15e627]: No browser automation, no cookie replay, no scraping and no unofficial posting endpoints. Official platform APIs only.
          - listitem [ref=f15e628]:
            - paragraph [ref=f15e632]: No promise about reach, ranking or engagement. Relay can tell you what happened and what to test next. It cannot tell you what an audience will do.
          - listitem [ref=f15e633]:
            - paragraph [ref=f15e637]: No unattended publishing by default. An agent can draft, validate and request approval. A human decides before anything becomes public, unless you deliberately opt a specific policy out.
