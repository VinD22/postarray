        - generic [ref=f15e105]:
          - heading "Your agent gets tools, not a text box" [level=2] [ref=f15e106]
          - paragraph [ref=f15e107]: The MCP server is a resource server in front of the same application services the web app uses. It holds no publishing logic and no second permission system, so an agent cannot reach anything you have not granted it, and it cannot route around an approval by using a different surface.
        - generic [ref=f15e108]:
          - generic [ref=f15e109]:
            - heading "Connecting is one config block" [level=3] [ref=f15e110]
            - list [ref=f15e111]:
              - listitem [ref=f15e112]:
                - generic [ref=f15e113]: "01"
                - generic [ref=f15e114]:
                  - heading "Point the client at the endpoint" [level=3] [ref=f15e115]
                  - paragraph [ref=f15e116]: Create a credential in Relay, then paste the workspace MCP endpoint into your client. The credential is read from an environment variable rather than written into the file, because a config committed to a repository is the most common way one leaks.
              - listitem [ref=f15e117]:
                - generic [ref=f15e118]: "02"
                - generic [ref=f15e119]:
                  - heading "The client authorizes over OAuth" [level=3] [ref=f15e120]
                  - paragraph [ref=f15e121]: Relay compares the token audience against this server as an exact string, never a prefix, and re-verifies the grant on every call. A revoked grant stops working in the middle of a long lived agent session.
              - listitem [ref=f15e122]:
                - generic [ref=f15e123]: "03"
                - generic [ref=f15e124]:
                  - heading "The agent reads your accounts, then works" [level=3] [ref=f15e125]
                  - paragraph [ref=f15e126]: It lists the accounts you connected, reads the live platform limits for each one, and drafts against those rather than against a guess. Account ids are resolved on the server, so a raw handle is never accepted.
