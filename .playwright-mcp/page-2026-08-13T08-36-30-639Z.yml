      - generic [ref=f9e424]:
        - heading "What Relay is built to be good at" [level=2] [ref=f9e425]
        - generic [ref=f9e426]:
          - generic [ref=f9e427]:
            - generic [ref=f9e428]: "01"
            - generic [ref=f9e431]:
              - heading "Publish with confidence" [level=3] [ref=f9e432]
              - paragraph [ref=f9e433]: A true preview per account, deterministic policy and platform checks before anything is queued, the approval your workspace requires, an immutable receipt with the external post ID, and a health state for every connection.
              - paragraph [ref=f9e434]: Every external write carries an idempotency key, so a worker crash after the platform accepted a post does not create a second one.
          - generic [ref=f9e435]:
            - generic [ref=f9e436]: "02"
            - generic [ref=f9e439]:
              - heading "Adapt rather than duplicate" [level=3] [ref=f9e440]
              - paragraph [ref=f9e441]: Per platform variants that you can override one account at a time, and transcreation rather than literal translation, with a brand glossary and a named reviewer per language.
              - paragraph [ref=f9e442]: The interface is available in selected languages. Content adaptation covers 30 content languages and every one of them is reviewable before it publishes.
          - generic [ref=f9e443]:
            - generic [ref=f9e444]: "03"
            - generic [ref=f9e447]:
              - heading "Close the loop" [level=3] [ref=f9e448]
              - paragraph [ref=f9e449]: Analytics that name the metric, the platform that reported it, the denominator and when it was last refreshed. Where a platform does not report something, Relay says so instead of showing a zero.
              - paragraph [ref=f9e450]: A post is compared against your own median rather than against a score nobody can audit.
          - generic [ref=f9e451]:
            - generic [ref=f9e452]: "04"
            - generic [ref=f9e455]:
              - heading "Work from where you already are" [level=3] [ref=f9e456]
              - paragraph [ref=f9e457]: The web app, a REST API, a remote MCP server, a CLI and signed webhooks call the same application services, the same authorization rules and the same validators.
              - paragraph [ref=f9e458]: An agent cannot bypass an approval policy by using a different surface, because the policy is enforced in the service, not in the interface.
          - generic [ref=f9e459]:
            - generic [ref=f9e460]: "05"
            - generic [ref=f9e463]:
              - heading "Economics you can predict" [level=3] [ref=f9e464]
              - paragraph [ref=f9e465]: One price, every shipped feature, 10 active channels and an owner plus 5 teammates. Platform usage that a provider charges per operation is passed through at cost and shown before you confirm the action.
              - paragraph [ref=f9e466]: There is no image or video generation credit system, because Relay does not generate media.
      - generic [ref=f9e469]:
        - heading "Five surfaces, one backend" [level=2] [ref=f9e470]
        - paragraph [ref=f9e471]: The same use cases, the same tenancy checks, the same validators and the same publishing workflows. A surface is a way in, never a shortcut past a rule.
        - generic [ref=f9e472]:
          - generic [ref=f9e473]: "5"
          - paragraph [ref=f9e474]: Surfaces on one shared backend
        - generic [ref=f9e475]:
