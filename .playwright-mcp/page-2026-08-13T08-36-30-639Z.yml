            - paragraph [ref=f9e479]: Composer, calendar, approvals, analytics, connections and settings.
          - generic [ref=f9e481]:
            - heading "REST API" [level=3] [ref=f9e482]
            - paragraph [ref=f9e483]: Scoped keys, idempotency keys on every write, cursor pagination, typed errors.
          - generic [ref=f9e485]:
            - heading "Remote MCP server" [level=3] [ref=f9e486]
            - paragraph [ref=f9e487]: Streamable HTTP, OAuth, per tool scopes and a preview before every consequential call.
          - generic [ref=f9e489]:
            - heading "CLI" [level=3] [ref=f9e490]
            - paragraph [ref=f9e491]: Stable machine readable output for scripts and continuous integration.
          - generic [ref=f9e493]:
            - heading "Signed webhooks" [level=3] [ref=f9e494]
            - paragraph [ref=f9e495]: Publish results, approval decisions and connection health, with redelivery.
        - paragraph [ref=f9e496]:
          - link "For developers" [ref=f9e497] [cursor=pointer]:
