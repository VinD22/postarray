      - generic [ref=f9e501]:
        - heading "What Relay does not do" [level=2] [ref=f9e502]
        - paragraph [ref=f9e503]: These are boundaries, not a roadmap tease. If one of them changes, it changes on the changelog first.
        - list [ref=f9e504]:
          - listitem [ref=f9e505]:
            - paragraph [ref=f9e509]: No AI image generation and no AI video generation. Relay adapts, approves, publishes and measures the media you bring.
          - listitem [ref=f9e510]:
            - paragraph [ref=f9e514]: No automatic likes, follows, reposts, unsolicited replies or direct messages. No engagement pods and no fabricated engagement.
          - listitem [ref=f9e515]:
            - paragraph [ref=f9e519]: No browser automation, no cookie replay, no scraping and no unofficial posting endpoints. Official platform APIs only.
          - listitem [ref=f9e520]:
            - paragraph [ref=f9e524]: No promise about reach, ranking or engagement. Relay can tell you what happened and what to test next. It cannot tell you what an audience will do.
          - listitem [ref=f9e525]:
            - paragraph [ref=f9e529]: No unattended publishing by default. An agent can draft, validate and request approval. A human decides before anything becomes public, unless you deliberately opt a specific policy out.
        - paragraph [ref=f9e530]:
          - link "Changelog" [ref=f9e531] [cursor=pointer]:
            - /url: /changelog
