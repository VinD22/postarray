      - generic [ref=e213]:
        - heading "What Relay does not do" [level=2] [ref=e214]
        - paragraph [ref=e215]: These are boundaries, not a roadmap tease. If one of them changes, it changes on the changelog first.
        - list [ref=e216]:
          - listitem [ref=e217]:
            - paragraph [ref=e221]: No AI image generation and no AI video generation. Relay adapts, approves, publishes and measures the media you bring.
          - listitem [ref=e222]:
            - paragraph [ref=e226]: No automatic likes, follows, reposts, unsolicited replies or direct messages. No engagement pods and no fabricated engagement.
          - listitem [ref=e227]:
            - paragraph [ref=e231]: No browser automation, no cookie replay, no scraping and no unofficial posting endpoints. Official platform APIs only.
          - listitem [ref=e232]:
            - paragraph [ref=e236]: No promise about reach, ranking or engagement. Relay can tell you what happened and what to test next. It cannot tell you what an audience will do.
          - listitem [ref=e237]:
            - paragraph [ref=e241]: No unattended publishing by default. An agent can draft, validate and request approval. A human decides before anything becomes public, unless you deliberately opt a specific policy out.
        - paragraph [ref=e242]:
          - link "Changelog" [ref=e243] [cursor=pointer]:
            - /url: /changelog
