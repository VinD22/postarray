      - generic [ref=e146]:
        - heading "What Relay is built to be good at" [level=2] [ref=e147]
        - generic [ref=e148]:
          - generic [ref=e149]:
            - generic [ref=e150]: "01"
            - generic [ref=e151]:
              - heading "Publish with confidence" [level=3] [ref=e152]
              - paragraph [ref=e153]: A true preview per account, deterministic policy and platform checks before anything is queued, the approval your workspace requires, an immutable receipt with the external post ID, and a health state for every connection.
              - paragraph [ref=e154]: Every external write carries an idempotency key, so a worker crash after the platform accepted a post does not create a second one.
          - generic [ref=e155]:
            - generic [ref=e156]: "02"
            - generic [ref=e157]:
              - heading "Adapt rather than duplicate" [level=3] [ref=e158]
              - paragraph [ref=e159]: Per platform variants that you can override one account at a time, and transcreation rather than literal translation, with a brand glossary and a named reviewer per language.
              - paragraph [ref=e160]: The interface is available in selected languages. Content adaptation covers 30 content languages and every one of them is reviewable before it publishes.
          - generic [ref=e161]:
            - generic [ref=e162]: "03"
            - generic [ref=e163]:
              - heading "Close the loop" [level=3] [ref=e164]
              - paragraph [ref=e165]: Analytics that name the metric, the platform that reported it, the denominator and when it was last refreshed. Where a platform does not report something, Relay says so instead of showing a zero.
              - paragraph [ref=e166]: A post is compared against your own median rather than against a score nobody can audit.
          - generic [ref=e167]:
            - generic [ref=e168]: "04"
            - generic [ref=e169]:
              - heading "Work from where you already are" [level=3] [ref=e170]
              - paragraph [ref=e171]: The web app, a REST API, a remote MCP server, a CLI and signed webhooks call the same application services, the same authorization rules and the same validators.
              - paragraph [ref=e172]: An agent cannot bypass an approval policy by using a different surface, because the policy is enforced in the service, not in the interface.
          - generic [ref=e173]:
            - generic [ref=e174]: "05"
            - generic [ref=e175]:
              - heading "Economics you can predict" [level=3] [ref=e176]
              - paragraph [ref=e177]: One price, every shipped feature, 10 active channels and an owner plus 5 teammates. Platform usage that a provider charges per operation is passed through at cost and shown before you confirm the action.
              - paragraph [ref=e178]: There is no image or video generation credit system, because Relay does not generate media.
