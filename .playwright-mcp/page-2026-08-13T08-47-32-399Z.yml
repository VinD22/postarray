      - generic [ref=f2e286]:
        - heading "What Relay is built to be good at" [level=2] [ref=f2e287]
        - generic [ref=f2e288]:
          - generic [ref=f2e289]:
            - generic [ref=f2e290]: "01"
            - generic [ref=f2e293]:
              - heading "Publish with confidence" [level=3] [ref=f2e294]
              - paragraph [ref=f2e295]: A true preview per account, deterministic policy and platform checks before anything is queued, the approval your workspace requires, an immutable receipt with the external post ID, and a health state for every connection.
              - paragraph [ref=f2e296]: Every external write carries an idempotency key, so a worker crash after the platform accepted a post does not create a second one.
          - generic [ref=f2e297]:
            - generic [ref=f2e298]: "02"
            - generic [ref=f2e301]:
              - heading "Adapt rather than duplicate" [level=3] [ref=f2e302]
              - paragraph [ref=f2e303]: Per platform variants that you can override one account at a time, and transcreation rather than literal translation, with a brand glossary and a named reviewer per language.
              - paragraph [ref=f2e304]: The interface is available in selected languages. Content adaptation covers 30 content languages and every one of them is reviewable before it publishes.
          - generic [ref=f2e305]:
            - generic [ref=f2e306]: "03"
            - generic [ref=f2e309]:
              - heading "Close the loop" [level=3] [ref=f2e310]
              - paragraph [ref=f2e311]: Analytics that name the metric, the platform that reported it, the denominator and when it was last refreshed. Where a platform does not report something, Relay says so instead of showing a zero.
              - paragraph [ref=f2e312]: A post is compared against your own median rather than against a score nobody can audit.
          - generic [ref=f2e313]:
            - generic [ref=f2e314]: "04"
            - generic [ref=f2e317]:
              - heading "Work from where you already are" [level=3] [ref=f2e318]
              - paragraph [ref=f2e319]: The web app, a REST API, a remote MCP server, a CLI and signed webhooks call the same application services, the same authorization rules and the same validators.
              - paragraph [ref=f2e320]: An agent cannot bypass an approval policy by using a different surface, because the policy is enforced in the service, not in the interface.
          - generic [ref=f2e321]:
            - generic [ref=f2e322]: "05"
            - generic [ref=f2e325]:
              - heading "Economics you can predict" [level=3] [ref=f2e326]
              - paragraph [ref=f2e327]: One price, every shipped feature, 10 active channels and an owner plus 5 teammates. Platform usage that a provider charges per operation is passed through at cost and shown before you confirm the action.
              - paragraph [ref=f2e328]: There is no image or video generation credit system, because Relay does not generate media.
      - generic [ref=f2e331]:
        - heading "Five surfaces, one backend" [level=2] [ref=f2e332]
        - paragraph [ref=f2e333]: The same use cases, the same tenancy checks, the same validators and the same publishing workflows. A surface is a way in, never a shortcut past a rule.
        - generic [ref=f2e334]:
          - generic [ref=f2e335]: "5"
          - paragraph [ref=f2e336]: Surfaces on one shared backend
        - generic [ref=f2e337]:
          - generic [ref=f2e339]:
            - heading "Web app" [level=3] [ref=f2e340]
            - paragraph [ref=f2e341]: Composer, calendar, approvals, analytics, connections and settings.
          - generic [ref=f2e343]:
            - heading "REST API" [level=3] [ref=f2e344]
            - paragraph [ref=f2e345]: Scoped keys, idempotency keys on every write, cursor pagination, typed errors.
          - generic [ref=f2e347]:
            - heading "Remote MCP server" [level=3] [ref=f2e348]
            - paragraph [ref=f2e349]: Streamable HTTP, OAuth, per tool scopes and a preview before every consequential call.
          - generic [ref=f2e351]:
            - heading "CLI" [level=3] [ref=f2e352]
            - paragraph [ref=f2e353]: Stable machine readable output for scripts and continuous integration.
          - generic [ref=f2e355]:
            - heading "Signed webhooks" [level=3] [ref=f2e356]
            - paragraph [ref=f2e357]: Publish results, approval decisions and connection health, with redelivery.
        - paragraph [ref=f2e358]:
          - link "For developers" [ref=f2e359]:
            - /url: /for-developers
      - generic [ref=f2e363]:
        - heading "What Relay does not do" [level=2] [ref=f2e364]
        - paragraph [ref=f2e365]: These are boundaries, not a roadmap tease. If one of them changes, it changes on the changelog first.
        - list [ref=f2e366]:
          - listitem [ref=f2e367]:
            - paragraph [ref=f2e371]: No AI image generation and no AI video generation. Relay adapts, approves, publishes and measures the media you bring.
          - listitem [ref=f2e372]:
            - paragraph [ref=f2e376]: No automatic likes, follows, reposts, unsolicited replies or direct messages. No engagement pods and no fabricated engagement.
          - listitem [ref=f2e377]:
            - paragraph [ref=f2e381]: No browser automation, no cookie replay, no scraping and no unofficial posting endpoints. Official platform APIs only.
          - listitem [ref=f2e382]:
            - paragraph [ref=f2e386]: No promise about reach, ranking or engagement. Relay can tell you what happened and what to test next. It cannot tell you what an audience will do.
          - listitem [ref=f2e387]:
            - paragraph [ref=f2e391]: No unattended publishing by default. An agent can draft, validate and request approval. A human decides before anything becomes public, unless you deliberately opt a specific policy out.
        - paragraph [ref=f2e392]:
          - link "Changelog" [ref=f2e393]:
            - /url: /changelog
