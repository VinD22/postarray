        - paragraph [ref=f1e47]: Demonstration
        - heading "How it works, in the order you meet it" [level=2] [ref=f1e48]
        - paragraph [ref=f1e49]: Six steps, from an empty workspace to the record of what happened. Each one shows the surface you would actually be looking at, with sample content in it.
        - generic [ref=f1e50]:
          - paragraph [ref=f1e51]: This is a demonstration, not a live account
          - paragraph [ref=f1e53]: Every panel here is the product interface with sample content in it. No connector has passed provider verification, so nothing publishes to any platform through this product today. Where the workflow stops, the page says so instead of drawing the rest.
      - generic [ref=f1e58]:
        - generic [ref=f1e59]:
          - paragraph [ref=f1e60]: Step 1 of 6
          - heading "Create a project" [level=3] [ref=f1e61]
          - paragraph [ref=f1e62]: A project holds accounts, drafts, approvals and a time zone. Every query in the product is scoped to one, in the application service and again in the database, so a client cannot see another client by accident.
