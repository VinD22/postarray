            - list [ref=e115]:
              - listitem [ref=e116]:
                - generic [ref=e119]: 10 active social channels. A channel is one social account, Page, profile, group or publication connection.
              - listitem [ref=e120]:
                - generic [ref=e123]: One owner and up to 5 teammates in each workspace. There is no separate per-seat charge within that limit.
              - listitem [ref=e124]:
                - generic [ref=e127]: Unlimited drafts, scheduled posts and stored receipts under a published fair use and anti spam policy. Those controls exist to protect your connected accounts and they apply identically to every subscriber.
              - listitem [ref=e128]:
                - generic [ref=e131]: X charges per API operation and charges more for a post that contains a URL. Relay passes that through at cost, estimates it before you confirm the action, and shows it in your usage. Other platform fees are passed through only when they are disclosed before the action.
              - listitem [ref=e132]:
                - generic [ref=e135]: AI image generation and AI video generation are not included and are not sold. There are no media credits, because Relay does not generate media.
              - listitem [ref=e136]:
                - generic [ref=e139]: The trial starts today and runs for seven days with every shipped feature. Beginning it takes no card. Polar shows the exact first charge amount and date before you confirm a subscription.
              - listitem [ref=e140]:
                - generic [ref=e143]: An uncanceled trial converts on day seven to the interval you chose. Polar emails a reminder three days before that happens.
              - listitem [ref=e144]:
                - generic [ref=e147]: Cancel from Settings without contacting support. Cancel during the trial and no charge is attempted.
              - listitem [ref=e148]:
                - generic [ref=e151]: Post text, receipts and audit history remain under the data policy. Uploaded files are permanently deleted 30 days after upload. Workspace export is available as structured JSON; CSV and media archives are not available yet.
