          - paragraph [ref=e108]: Your seven day trial starts today. No card is collected to begin it, and you choose monthly or annual when it ends.
          - paragraph [ref=e109]: Cancel at any time from Settings during the trial and you are charged nothing. Connector availability is shown account by account as each platform completes its review.
