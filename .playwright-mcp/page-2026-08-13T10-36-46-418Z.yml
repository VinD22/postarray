          - heading "Create a project" [level=3] [ref=f20e98]
          - paragraph [ref=f20e99]: A project holds accounts, drafts, approvals and a time zone. Every query in the product is scoped to one, in the application service and again in the database, so a client cannot see another client by accident.
          - paragraph [ref=f20e100]:
            - 'link "Next: Connect accounts" [ref=f20e103] [cursor=pointer]':
