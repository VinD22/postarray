          - heading "Write it once, adapt it per platform" [level=3] [ref=f20e162]
          - paragraph [ref=f20e163]: You write a master draft. Selecting one account opens an override for that account alone, with its own limits and its own preview. Nothing you write for LinkedIn changes what X receives, and the checks under each version run before anything is scheduled.
