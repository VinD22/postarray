    - generic [ref=f3e1248]:
      - generic [ref=f3e1249]:
        - paragraph [ref=f3e1250]: FAQ
        - paragraph [ref=f3e1251]: Frequently Asked Questions
      - list [ref=f3e1252]:
        - listitem [ref=f3e1253]:
          - button "Why switch from Buffer or Hootsuite?" [ref=f3e1254] [cursor=pointer]
          - generic [ref=f3e1260]:
            - paragraph [ref=f3e1261]: Same core features, 1/10th the price, actually simple to use.
            - paragraph [ref=f3e1262]: "Tools like Buffer and Hootsuite charge $75-$200/month for features most people never use. Post bridge focuses on what matters: posting to all your platforms quickly and reliably."
            - paragraph [ref=f3e1263]: No bloated dashboards, no enterprise features you don't need. Just connect your accounts, create your post, and publish everywhere in 30 seconds.
            - paragraph [ref=f3e1264]: Plus you get human support from jack (the founder) instead of waiting days for ticket responses.
        - listitem [ref=f3e1265]:
          - button "What social platforms do you support?" [ref=f3e1266] [cursor=pointer]
          - generic [ref=f3e1272]:
            - text: Currently we support Twitter/X, Instagram, LinkedIn, Facebook, TikTok, YouTube, Bluesky, Threads, Pinterest, Google Business for scheduled posting and instant posting. To see all platforms we offer and that are coming soon
            - link "click here" [ref=f3e1273] [cursor=pointer]:
              - /url: /#platforms
            - text: . If you have a request please feel free to email us.
        - listitem [ref=f3e1274]:
          - button "How many social accounts can I connect?" [ref=f3e1275] [cursor=pointer]
          - generic: Depends on your plan, see the pricing section for more details... You will not find a more fair price anywhere else.
        - listitem [ref=f3e1282]:
          - button "What is a social account?" [ref=f3e1283] [cursor=pointer]
          - generic: "Social accounts are accounts of supported social media platforms. For example: Connecting your instagram account = connecting 1 social account."
        - listitem [ref=f3e1290]:
          - button "Can I connect 2 accounts to the same platform?" [ref=f3e1291] [cursor=pointer]
          - generic: "Yes. Example: Starter plan can connect 5 total accounts, all of them can be tiktok accounts, or 3 of them could be tiktok and 2 instagram accounts for their cap of 5."
        - listitem [ref=f3e1298]:
          - button "How many posts can I make and schedule per month?" [ref=f3e1299] [cursor=pointer]
          - generic: Unlimited for paying users. 5 for free users. 1 post to 4 platforms = 4 posts total.
        - listitem [ref=f3e1306]:
          - button "What types of content can I post?" [ref=f3e1307] [cursor=pointer]
          - generic: "You can create and schedule various types of posts including: videos, images, text posts, carousels (multiple images), and reels. This gives you the flexibility to share all types of content across your social media platforms."
        - listitem [ref=f3e1314]:
          - button "Will my posts get less reach using this app?" [ref=f3e1315] [cursor=pointer]
          - generic [ref=f3e1321]:
            - generic [ref=f3e1322]: No, you will have the same reach as if you posted manually. We understand you may be wary that the algorithm favors manual posting, we were too! However, under our own testing we have found no difference in reach between manual posting and posting from post bridge.
            - generic [ref=f3e1323]:
              - img "Proof of views comparison" [ref=f3e1324]
              - img "views with post bridge testimonial" [ref=f3e1325]
            - generic [ref=f3e1326]:
              - text: Also checkout our blog post
              - link "here" [ref=f3e1327] [cursor=pointer]:
                - /url: /blog/social-media-best-practices
              - text: to make sure you are using a warm account with best practices for getting your content to go viral.
        - listitem [ref=f3e1328]:
          - button "Can I cancel anytime?" [ref=f3e1329] [cursor=pointer]
          - generic: Yes, there's no lock-in and you can cancel your subscription at anytime of the month. When cancelling it will cancel at the end of your current billing period; you can still use the pro features until the end of your billing period.
        - listitem [ref=f3e1336]:
          - button "Can I get a refund?" [ref=f3e1337] [cursor=pointer]
          - paragraph [ref=f3e1343]: Yes! You can request a refund within 7 days of being charged. Just reach out by email in this time frame.
        - listitem [ref=f3e1344]:
          - button "Do I need to share my social media passwords with you?" [ref=f3e1345] [cursor=pointer]
          - generic: No, we never ask for or store your passwords directly. We use official authentication methods provided by each social platform, which means you log in securely through their official login pages. This is the same secure method used by all legitimate social media management tools.
        - listitem [ref=f3e1352]:
          - button "I have another question" [ref=f3e1353] [cursor=pointer]
          - generic: "Cool, contact us by email: support@post-bridge.com 👋"
        - listitem [ref=f3e1360]:
          - button "Which AI agents work with post bridge?" [ref=f3e1361] [cursor=pointer]
          - paragraph [ref=f3e1368]:
            - text: Claude (one-click connector), ChatGPT, OpenClaw, Hermes, Cursor, and any agent that speaks MCP or plain HTTP. There's also a CLI (
            - code [ref=f3e1369]: postbridge-cli
            - text: ) for terminal-based agents.
        - listitem [ref=f3e1370]:
          - button "How does my agent connect?" [ref=f3e1371] [cursor=pointer]
          - paragraph [ref=f3e1378]:
            - text: "Three ways: install the post bridge connector from the Claude directory, paste our MCP server URL into your agent's config, or use the REST API with an API key. Takes a couple of minutes whichever way you pick. See"
            - link "the agent setup guide" [ref=f3e1379] [cursor=pointer]:
              - /url: /agents
            - text: .
        - listitem [ref=f3e1380]:
          - button "Can I review posts before my agent publishes them?" [ref=f3e1381] [cursor=pointer]
          - paragraph [ref=f3e1388]: Yes. Tell your agent to draft or schedule instead of posting immediately. Everything lands in your calendar where you can edit, reschedule or delete before it goes out.
        - listitem [ref=f3e1389]:
          - button "Do I need my own Instagram or TikTok developer accounts?" [ref=f3e1390] [cursor=pointer]
          - paragraph [ref=f3e1397]: No. Connect your socials to post bridge once and your agent uses our integrations. No Meta app review, no platform developer accounts, no token maintenance.
