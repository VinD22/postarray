          - generic [ref=f1e69]:
            - link "Join the public prelaunch" [ref=f1e70] [cursor=pointer]:
              - /url: /sign-up
            - paragraph [ref=f1e71]: Public prelaunch access is free. No card or payment method is collected.
            - paragraph [ref=f1e72]: Paid checkout, invoices and trial conversion stay unavailable until the commercial launch gates pass.
            - paragraph [ref=f1e73]: Planned prices are in US dollars. Taxes and merchant terms will be shown before checkout opens.
        - generic [ref=f1e74]:
          - heading "Planned paid terms" [level=2] [ref=f1e75]
          - list [ref=f1e77]:
            - listitem [ref=f1e78]:
              - generic [ref=f1e81]: 10 active social channels. A channel is one social account, Page, profile, group or publication connection.
            - listitem [ref=f1e82]:
              - generic [ref=f1e85]: One owner and up to 5 teammates in each workspace. There is no separate per-seat charge within that limit.
            - listitem [ref=f1e86]:
              - generic [ref=f1e89]: Unlimited drafts, scheduled posts and stored receipts under a published fair use and anti spam policy. Those controls exist to protect your connected accounts and they apply identically to every subscriber.
            - listitem [ref=f1e90]:
              - generic [ref=f1e93]: X charges per API operation and charges more for a post that contains a URL. Relay passes that through at cost, estimates it before you confirm the action, and shows it in your usage. Other platform fees are passed through only when they are disclosed before the action.
            - listitem [ref=f1e94]:
              - generic [ref=f1e97]: AI image generation and AI video generation are not included and are not sold. There are no media credits, because Relay does not generate media.
            - listitem [ref=f1e98]:
              - generic [ref=f1e101]: When paid access opens, the trial will run for seven days with every shipped feature. Polar will show the exact first charge amount and date before you confirm.
            - listitem [ref=f1e102]:
              - generic [ref=f1e105]: When checkout opens, an uncanceled trial will convert on day seven to the interval you chose. Polar will email a reminder three days before that happens.
            - listitem [ref=f1e106]:
              - generic [ref=f1e109]: Paid access is not active during prelaunch. When it opens, you will be able to cancel from Settings without contacting support.
            - listitem [ref=f1e110]:
              - generic [ref=f1e113]: Post text, receipts and audit history remain under the data policy. Uploaded files are permanently deleted 30 days after upload. Workspace export is available as structured JSON; CSV and media archives are not available yet.
