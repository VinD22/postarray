          - paragraph [ref=f1e143]: Text assistance under the published abuse and cost limits
          - paragraph [ref=f1e146]: Email and in app support
        - paragraph [ref=f1e147]: Fair use means anti spam, rate and provider cost controls that protect your accounts. They work the same for every subscriber.
