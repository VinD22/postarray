    - main [ref=f17e13]:
      - generic [ref=f17e17]:
        - paragraph [ref=f17e18]: Seven day free trial. No card required.
        - heading "One plan" [level=1] [ref=f17e19]
        - paragraph [ref=f17e20]: There are no feature tiers. Every feature is included at every price, including the MCP server an agent connects to, and the seven day free trial starts without a card.
      - generic [ref=f17e23]:
        - heading "Pay monthly or yearly" [level=2] [ref=f17e24]
        - paragraph [ref=f17e25]: The same plan either way. What it buys is active project capacity, and that is the only number on this page that ever changes.
        - generic [ref=f17e26]:
          - group "How you want to pay" [ref=f17e27]:
            - generic [ref=f17e29] [cursor=pointer]:
              - radio "Monthly" [checked] [ref=f17e30]
              - generic [ref=f17e31]: Monthly
            - generic [ref=f17e32] [cursor=pointer]:
              - radio "Yearly 2 months free" [ref=f17e33]
              - generic [ref=f17e34]: Yearly
              - generic [ref=f17e35]: 2 months free
          - article [ref=f17e38]:
            - generic [ref=f17e39]:
              - generic [ref=f17e40]:
                - heading "Standard" [level=3] [ref=f17e41]
                - paragraph [ref=f17e42]: For one team running a handful of projects.
              - generic [ref=f17e43]:
                - generic [ref=f17e44]: $25
                - paragraph [ref=f17e45]: per month
              - paragraph [ref=f17e46]: Charged every month. Cancel from Settings at any time.
              - generic [ref=f17e47]:
                - link "Start your free trial" [ref=f17e48] [cursor=pointer]:
                  - /url: /sign-up
                - paragraph [ref=f17e49]: The seven day trial starts the day you sign up and takes no card. You choose monthly or yearly when it ends, and Polar shows the exact amount and date before you confirm.
            - generic [ref=f17e50]:
              - paragraph [ref=f17e51]: Included at both prices
              - list [ref=f17e52]:
                - listitem [ref=f17e53]:
                  - generic [ref=f17e56]: 3 active projects
                - listitem [ref=f17e57]:
                  - generic [ref=f17e60]: Up to 10 active social channels
                - listitem [ref=f17e61]:
                  - generic [ref=f17e64]: Owner plus 5 teammates
                - listitem [ref=f17e65]:
                  - generic [ref=f17e68]: Unlimited drafts and scheduled posts under fair use
                - listitem [ref=f17e69]:
                  - generic [ref=f17e72]: Every approved connector
                - listitem [ref=f17e73]:
                  - generic [ref=f17e76]: Analytics kept from the day you connect an account
                - listitem [ref=f17e77]:
                  - generic [ref=f17e80]: REST API, remote MCP server, CLI and webhooks
                - listitem [ref=f17e81]:
                  - generic [ref=f17e84]: Automation rules, RSS autopost and tracked links
                - listitem [ref=f17e85]:
                  - generic [ref=f17e88]: Text assistance under the published abuse and cost limits
                - listitem [ref=f17e89]:
                  - generic [ref=f17e92]: Email and in app support
        - generic [ref=f17e93]:
          - paragraph [ref=f17e94]: Fair use means anti spam, rate and provider cost controls that protect your accounts. They work the same for every subscriber.
          - paragraph [ref=f17e95]: Prices are in US dollars. Taxes and merchant terms are shown at checkout before you confirm.
        - generic [ref=f17e96]:
          - heading "More capacity than one plan covers" [level=3] [ref=f17e97]
          - paragraph [ref=f17e98]: Larger project capacity is decided and priced. It appears on this page as soon as its checkout opens, and the changelog is where that gets announced.
          - paragraph [ref=f17e99]:
            - link "Changelog" [ref=f17e100] [cursor=pointer]:
              - /url: /changelog
      - generic [ref=f17e103]:
        - heading "The paid terms" [level=2] [ref=f17e104]
        - list [ref=f17e106]:
          - listitem [ref=f17e107]:
            - generic [ref=f17e110]: 10 active social channels. A channel is one social account, Page, profile, group or publication connection.
          - listitem [ref=f17e111]:
            - generic [ref=f17e114]: One owner and up to 5 teammates in each workspace. There is no separate per-seat charge within that limit.
          - listitem [ref=f17e115]:
            - generic [ref=f17e118]: Unlimited drafts, scheduled posts and stored receipts under a published fair use and anti spam policy. Those controls exist to protect your connected accounts and they apply identically to every subscriber.
          - listitem [ref=f17e119]:
            - generic [ref=f17e122]: X charges per API operation and charges more for a post that contains a URL. Relay passes that through at cost, estimates it before you confirm the action, and shows it in your usage. Other platform fees are passed through only when they are disclosed before the action.
          - listitem [ref=f17e123]:
            - generic [ref=f17e126]: AI image generation and AI video generation are not included and are not sold. There are no media credits, because Relay does not generate media.
          - listitem [ref=f17e127]:
            - generic [ref=f17e130]: The trial starts today and runs for seven days with every shipped feature. Beginning it takes no card. Polar shows the exact first charge amount and date before you confirm a subscription.
          - listitem [ref=f17e131]:
            - generic [ref=f17e134]: An uncanceled trial converts on day seven to the interval you chose. Polar emails a reminder three days before that happens.
          - listitem [ref=f17e135]:
            - generic [ref=f17e138]: Cancel from Settings without contacting support. Cancel during the trial and no charge is attempted.
          - listitem [ref=f17e139]:
            - generic [ref=f17e142]: Post text, receipts and audit history remain under the data policy. Uploaded files are permanently deleted 30 days after upload. Workspace export is available as structured JSON; CSV and media archives are not available yet.
      - generic [ref=f17e147]:
        - heading "Why we do not generate images or video" [level=2] [ref=f17e149]
        - generic [ref=f17e150]:
          - paragraph [ref=f17e151]: "We focus on helping you plan, approve, publish and learn. We do not generate images or video in V1 because brand-ready media needs more than a short prompt: it needs your complete visual system, accurate product details, licensed assets, people and usage permissions, and careful review. Creative models also change quickly. We recommend currently verified specialist tools and make it easy to bring their finished work into your campaigns while you keep creative control."
          - paragraph [ref=f17e152]: There are no image or video generation credits, because Relay does not generate media.
          - paragraph [ref=f17e153]:
            - link "Creative tool radar" [ref=f17e154] [cursor=pointer]:
              - /url: /tool-radar
      - generic [ref=f17e158]:
        - heading "There are no customer quotes on this page yet" [level=2] [ref=f17e159]
        - paragraph [ref=f17e160]: A quote goes up only when the customer wrote it, gave written permission for it, and we can point to the work it describes. Until then an empty space is more honest than a wall of invented praise.
