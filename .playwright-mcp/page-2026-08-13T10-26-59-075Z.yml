      - generic [ref=f17e204]:
        - heading "Start publishing on one plan" [level=2] [ref=f17e205]
        - paragraph [ref=f17e206]: Signing up starts the seven day trial today and collects no card. Which connectors are available is shown for your account, platform by platform, as each review completes.
        - link "Start your free trial" [ref=f17e208] [cursor=pointer]:
          - /url: /sign-up
        - paragraph [ref=f17e209]: Relay costs $25 a month, or $250 a year, which is two months free. The seven day trial starts today and beginning it takes no card. Connector availability is shown account by account as each platform completes its review.
